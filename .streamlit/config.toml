[theme]
base = "dark"
primaryColor = "#7C3AED"
backgroundColor = "#090710"
secondaryBackgroundColor = "#15111F"
textColor = "#F4EFFA"
borderColor = "#332842"
linkColor = "#C4A7F8"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.25rem"
paddingBottom = "1.5rem"

[theme.sidebar]
backgroundColor = "#0B0912"
secondaryBackgroundColor = "#15111F"
textColor = "#F4EFFA"
borderColor = "#332842"
primaryColor = "#7C3AED"
linkColor = "#C4A7F8"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
